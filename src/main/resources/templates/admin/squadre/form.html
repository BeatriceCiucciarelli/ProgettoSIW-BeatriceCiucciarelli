<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Squadra</title>
</head>
<body>
    <h1 th:text="${squadra.id} != null ? 'Modifica squadra' : 'Nuova squadra'">Squadra</h1>

    <form th:action="${squadra.id} != null ? @{'/admin/squadre/' + ${squadra.id}} : @{/admin/squadre}"
          th:object="${squadra}" method="post">

        <div>
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" />
            <div style="color:red" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Errore nome</div>
        </div>

        <div>
            <label for="citta">Citta'</label>
            <input type="text" id="citta" th:field="*{citta}" />
            <div style="color:red" th:if="${#fields.hasErrors('citta')}" th:errors="*{citta}">Errore citta'</div>
        </div>

        <div>
            <label for="annoFondazione">Anno di fondazione</label>
            <input type="number" id="annoFondazione" th:field="*{annoFondazione}" />
            <div style="color:red" th:if="${#fields.hasErrors('annoFondazione')}" th:errors="*{annoFondazione}">Errore anno</div>
        </div>

        <button type="submit">Salva</button>
    </form>
</body>
</html>
