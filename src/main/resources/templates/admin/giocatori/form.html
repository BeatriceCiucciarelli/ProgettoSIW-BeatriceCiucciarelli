<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Giocatore</title>
</head>
<body>
    <h1 th:text="${giocatore.id} != null ? 'Modifica giocatore' : 'Nuovo giocatore'">Giocatore</h1>

    <form th:action="${giocatore.id} != null
                        ? @{'/admin/giocatori/' + ${giocatore.id}}
                        : @{'/admin/squadre/' + ${giocatore.squadra.id} + '/giocatori'}"
          th:object="${giocatore}" method="post">

        <div>
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" required="required" />
        </div>

        <div>
            <label for="cognome">Cognome</label>
            <input type="text" id="cognome" th:field="*{cognome}" required="required" />
        </div>

        <div>
            <label for="dataDiNascita">Data di nascita</label>
            <input type="date" id="dataDiNascita" th:field="*{dataDiNascita}" required="required" />
        </div>

        <div>
            <label for="altezza">Altezza (cm)</label>
            <input type="number" id="altezza" th:field="*{altezza}" required="required" />
        </div>

        <div>
            <label for="ruolo">Ruolo</label>
            <select id="ruolo" th:field="*{ruolo}">
                <option value="PORTIERE">Portiere</option>
                <option value="DIFENSORE">Difensore</option>
                <option value="CENTROCAMPISTA">Centrocampista</option>
                <option value="ATTACCANTE">Attaccante</option>
            </select>
        </div>

        <button type="submit">Salva</button>
    </form>
</body>
</html>
