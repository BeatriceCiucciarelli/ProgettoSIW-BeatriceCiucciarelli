<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Giocatore</title>
</head>
<body>
    <h1 th:text="${giocatore.id} != null ? 'Modifica giocatore' : 'Nuovo giocatore'">Giocatore</h1>

    <form th:action="${giocatore.id} != null
                        ? @{'/admin/giocatori/' + ${giocatore.id}}
                        : @{'/admin/squadre/' + ${giocatore.squadra.id} + '/giocatori'}"
          th:object="${giocatore}" method="post">

        <div>
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" />
            <div style="color:red" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Errore nome</div>
        </div>

        <div>
            <label for="cognome">Cognome</label>
            <input type="text" id="cognome" th:field="*{cognome}" />
            <div style="color:red" th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}">Errore cognome</div>
        </div>

        <div>
            <label for="dataDiNascita">Data di nascita</label>
            <input type="date" id="dataDiNascita" th:field="*{dataDiNascita}" />
            <div style="color:red" th:if="${#fields.hasErrors('dataDiNascita')}" th:errors="*{dataDiNascita}">Errore data</div>
        </div>

        <div>
            <label for="altezza">Altezza (cm)</label>
            <input type="number" id="altezza" th:field="*{altezza}" />
            <div style="color:red" th:if="${#fields.hasErrors('altezza')}" th:errors="*{altezza}">Errore altezza</div>
        </div>

        <div>
            <label for="ruolo">Ruolo</label>
            <select id="ruolo" th:field="*{ruolo}">
                <option value="PORTIERE">Portiere</option>
                <option value="DIFENSORE">Difensore</option>
                <option value="CENTROCAMPISTA">Centrocampista</option>
                <option value="ATTACCANTE">Attaccante</option>
            </select>
        </div>

        <button type="submit">Salva</button>
    </form>
</body>
</html>
