<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Risultato partita</title>
</head>
<body>
    <h1>Inserisci risultato</h1>

    <p>
        <span th:text="${partita.squadraHome.nome}">Home</span>
        vs
        <span th:text="${partita.squadraAway.nome}">Away</span>
    </p>

    <form th:action="@{'/admin/partite/' + ${partita.id} + '/risultato'}" method="post">
        <div>
            <label for="goalsHome" th:text="'Goal ' + ${partita.squadraHome.nome}">Goal home</label>
            <input type="number" id="goalsHome" name="goalsHome" min="0"
                   th:value="${partita.goalsHome}" required="required" />
        </div>

        <div>
            <label for="goalsAway" th:text="'Goal ' + ${partita.squadraAway.nome}">Goal away</label>
            <input type="number" id="goalsAway" name="goalsAway" min="0"
                   th:value="${partita.goalsAway}" required="required" />
        </div>

        <button type="submit">Salva risultato</button>
    </form>
</body>
</html>
