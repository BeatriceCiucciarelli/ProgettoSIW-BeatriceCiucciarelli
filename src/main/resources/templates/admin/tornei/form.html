<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(title='Torneo')}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container" style="max-width: 600px;">
    <h1 class="mb-4" th:text="${torneo.id} != null ? 'Modifica torneo' : 'Nuovo torneo'">Torneo</h1>

    <form th:action="${torneo.id} != null ? @{'/admin/tornei/' + ${torneo.id}} : @{/admin/tornei}"
          th:object="${torneo}" method="post">

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" id="nome" th:field="*{nome}"
                   class="form-control" th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Errore nome</div>
        </div>

        <div class="mb-3">
            <label for="anno" class="form-label">Anno</label>
            <input type="number" id="anno" th:field="*{anno}"
                   class="form-control" th:classappend="${#fields.hasErrors('anno')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}">Errore anno</div>
        </div>

        <div class="mb-3">
            <label for="descrizione" class="form-label">Descrizione</label>
            <textarea id="descrizione" th:field="*{descrizione}" rows="4"
                      class="form-control" th:classappend="${#fields.hasErrors('descrizione')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}">Errore descrizione</div>
        </div>

        <button type="submit" class="btn btn-primary">Salva</button>
    </form>
</div>

</body>
</html>
