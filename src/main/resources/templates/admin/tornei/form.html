<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Torneo</title>
</head>
<body>
    <h1 th:text="${torneo.id} != null ? 'Modifica torneo' : 'Nuovo torneo'">Torneo</h1>

    <form th:action="${torneo.id} != null ? @{'/admin/tornei/' + ${torneo.id}} : @{/admin/tornei}"
          th:object="${torneo}" method="post">

        <div>
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" required="required" />
        </div>

        <div>
            <label for="anno">Anno</label>
            <input type="number" id="anno" th:field="*{anno}" required="required" />
        </div>

        <div>
            <label for="descrizione">Descrizione</label>
            <textarea id="descrizione" th:field="*{descrizione}" rows="4" cols="40"></textarea>
        </div>

        <button type="submit">Salva</button>
    </form>
</body>
</html>
