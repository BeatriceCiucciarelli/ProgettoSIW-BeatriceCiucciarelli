<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Torneo</title>
</head>
<body>
    <h1 th:text="${torneo.id} != null ? 'Modifica torneo' : 'Nuovo torneo'">Torneo</h1>

    <form th:action="${torneo.id} != null ? @{'/admin/tornei/' + ${torneo.id}} : @{/admin/tornei}"
          th:object="${torneo}" method="post">

        <div>
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" />
            <!-- Mostra il messaggio di errore SOLO se questo campo specifico ha errori -->
            <div style="color:red" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">
                Errore nome
            </div>
        </div>

        <div>
            <label for="anno">Anno</label>
            <input type="number" id="anno" th:field="*{anno}" />
            <div style="color:red" th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}">
                Errore anno
            </div>
        </div>

        <div>
            <label for="descrizione">Descrizione</label>
            <textarea id="descrizione" th:field="*{descrizione}" rows="4" cols="40"></textarea>
            <div style="color:red" th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}">
                Errore descrizione
            </div>
        </div>

        <button type="submit">Salva</button>
    </form>
</body>
</html>
