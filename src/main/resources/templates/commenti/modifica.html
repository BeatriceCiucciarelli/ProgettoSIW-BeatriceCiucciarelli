<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Modifica commento</title>
</head>
<body>
    <h1>Modifica commento</h1>

    <form th:action="@{'/commenti/' + ${commento.id}}" method="post">
        <textarea name="testo" rows="3" cols="40" th:text="${commento.testo}"></textarea>
        <br/>
        <button type="submit">Salva modifiche</button>
    </form>
</body>
</html>
