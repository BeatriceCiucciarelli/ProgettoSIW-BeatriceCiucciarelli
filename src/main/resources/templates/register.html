<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(title='Registrati')}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container" style="max-width: 400px;">
    <h1 class="mb-4">Registrati</h1>

    <form th:action="@{/register}" th:object="${utente}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" th:field="*{username}"
                   class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Errore username</div>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" th:field="*{password}"
                   class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Errore password</div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Registrati</button>
    </form>

    <p class="mt-3 text-center">
        Hai già un account? <a th:href="@{/login}">Accedi</a>
    </p>
</div>

</body>
</html>
