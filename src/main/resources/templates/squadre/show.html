<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head(title=${squadra != null ? squadra.nome : 'Squadra'})}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
    <div th:if="${squadra}">
        <div class="card mb-4">
            <div class="card-body">
                <h1 class="card-title" th:text="${squadra.nome}">Nome squadra</h1>
                <p class="card-text mb-1">
                    <strong>Citta':</strong> <span th:text="${squadra.citta}">Citta'</span>
                </p>
                <p class="card-text">
                    <strong>Anno di fondazione:</strong> <span th:text="${squadra.annoFondazione}">2000</span>
                </p>

                <div sec:authorize="hasAuthority('ADMIN')" class="mt-3">
                    <a th:href="@{'/admin/squadre/' + ${squadra.id} + '/modifica'}" class="btn btn-outline-secondary">
                        Modifica squadra
                    </a>
                    <form th:action="@{'/admin/squadre/' + ${squadra.id} + '/elimina'}" method="post"
                          class="d-inline"
                          onsubmit="return confirm('Eliminare definitivamente questa squadra?');">
                        <button type="submit" class="btn btn-outline-danger">Elimina squadra</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Giocatori</h2>
            <a sec:authorize="hasAuthority('ADMIN')"
               th:href="@{'/admin/squadre/' + ${squadra.id} + '/giocatori/nuovo'}"
               class="btn btn-success btn-sm">
                + Nuovo giocatore
            </a>
        </div>

        <div th:if="${squadra.giocatori != null and !squadra.giocatori.isEmpty()}">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Cognome</th>
                        <th>Ruolo</th>
                        <th sec:authorize="hasAuthority('ADMIN')"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="giocatore : ${squadra.giocatori}">
                        <td th:text="${giocatore.nome}">Nome</td>
                        <td th:text="${giocatore.cognome}">Cognome</td>
                        <td><span class="badge bg-secondary" th:text="${giocatore.ruolo}">RUOLO</span></td>
                        <td sec:authorize="hasAuthority('ADMIN')">
                            <a th:href="@{'/admin/giocatori/' + ${giocatore.id} + '/modifica'}"
                               class="btn btn-sm btn-outline-secondary">Modifica</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:unless="${squadra.giocatori != null and !squadra.giocatori.isEmpty()}" class="alert alert-info">
            Nessun giocatore presente.
        </div>
    </div>

    <div th:unless="${squadra}" class="alert alert-warning">
        Squadra non trovata.
    </div>
</div>

</body>
</html>
