<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pagina non trovata</title>
</head>
<body>
    <h1>404 - Non trovato</h1>
    <p th:if="${messaggio}" th:text="${messaggio}">
        La risorsa richiesta non esiste.
    </p>
    <p th:unless="${messaggio}">
        La pagina che stai cercando non esiste o e' stata rimossa.
    </p>
    <p><a th:href="@{/}">Torna alla home</a></p>
</body>
</html>
