<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dettaglio partita</title>
</head>
<body>
    <div th:if="${partita}">
        <h1>Dettaglio partita</h1>

        <div>
            Torneo:
            <span th:text="${partita.torneo.nome}">Nome torneo</span>
        </div>

        <div>
            Squadra home:
            <span th:text="${partita.squadraHome.nome}">Squadra home</span>
        </div>

        <div>
            Squadra away:
            <span th:text="${partita.squadraAway.nome}">Squadra away</span>
        </div>

        <div>
            Data e ora:
            <span th:text="${partita.dataOra}">2026-06-01T18:00</span>
        </div>

        <div>
            Luogo:
            <span th:text="${partita.luogo}">Stadio</span>
        </div>

        <div>
            Stato:
            <span th:text="${partita.stato}">SCHEDULED</span>
        </div>

        <div>
            Arbitro:
            <span th:text="${partita.arbitro.nome + ' ' + partita.arbitro.cognome}">Nome Arbitro</span>
        </div>

        <div th:if="${partita.stato.toString() == 'PLAYED'}">
            Risultato:
            <span th:text="${partita.goalsHome}">0</span>
            -
            <span th:text="${partita.goalsAway}">0</span>
        </div>
    </div>

    <div th:unless="${partita}">
        Partita non trovata.
    </div>
</body>
</html>
