<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common :: head(title=${torneo.nome})}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>

<div class="container">
    <div class="card">
        <div class="card-body">
            <h1 class="card-title" th:text="${torneo.nome}">Nome torneo</h1>
            <h6 class="card-subtitle mb-3 text-muted" th:text="${torneo.anno}">2026</h6>
            <p class="card-text" th:text="${torneo.descrizione}">Descrizione</p>

            <a th:href="@{'/tornei/' + ${torneo.id} + '/classifica'}" class="btn btn-primary">
                Vedi classifica
            </a>
            <a th:href="@{'/tornei/' + ${torneo.id} + '/classifica-react'}" class="btn btn-outline-primary">
                Vedi classifica (React)
            </a>
            <a sec:authorize="hasAuthority('ADMIN')"
               th:href="@{'/admin/tornei/' + ${torneo.id} + '/modifica'}"
               class="btn btn-outline-secondary">
                Modifica torneo
            </a>
        </div>
    </div>
</div>

</body>
</html>
