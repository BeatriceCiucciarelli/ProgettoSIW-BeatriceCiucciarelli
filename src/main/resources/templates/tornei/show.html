<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Torneo</title>
</head>
<body>
    <h1 th:text="${torneo.nome}">Nome torneo</h1>

    <div>
        Anno: <span th:text="${torneo.anno}">2000</span>
    </div>

    <div>
        Descrizione: <span th:text="${torneo.descrizione}">Descrizione</span>
    </div>

    <div>
        <a th:href="@{'/tornei/' + ${torneo.id} + '/classifica'}">Vedi classifica</a>
    </div>

    <div sec:authorize="hasAuthority('ADMIN')">
        <a th:href="@{'/admin/tornei/' + ${torneo.id} + '/modifica'}">Modifica torneo</a>
    </div>
</body>
</html>
