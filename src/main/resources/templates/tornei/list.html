<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Tornei</title>
</head>
<body>
    <h1>Lista tornei</h1>

    <div sec:authorize="hasAuthority('ADMIN')">
        <a th:href="@{/admin/tornei/nuovo}">+ Nuovo torneo</a>
    </div>

    <div>
        <ul>
            <li th:each="torneo : ${tornei}">
                <a th:href="@{'/tornei/' + ${torneo.id}}"
                   th:text="${torneo.nome}">Nome torneo</a>
            </li>
        </ul>
    </div>
</body>
</html>
