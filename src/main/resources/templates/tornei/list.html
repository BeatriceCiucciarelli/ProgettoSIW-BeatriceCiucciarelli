<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tornei</title>
</head>
<body>
    <h1>Lista tornei</h1>

    <div>
        <ul>
            <li th:each="torneo : ${tornei}">
                <a th:href="@{'/tornei/' + ${torneo.id}}"
                   th:text="${torneo.nome}">Nome torneo</a>
            </li>
        </ul>
    </div>
</body>
</html>
