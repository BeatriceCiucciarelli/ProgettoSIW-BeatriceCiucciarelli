# Messaggi generici di validazione (sovrascrivono i default in inglese di Hibernate Validator)
NotBlank=Campo obbligatorio
NotNull=Campo obbligatorio
Size=La lunghezza inserita non è valida
Min=Il valore è troppo basso
Max=Il valore è troppo alto
Past=La data deve essere nel passato

# Errori di conversione (es. testo inserito dove serve un numero)
typeMismatch=Formato non valido
typeMismatch.java.lang.Integer=Deve essere un numero
typeMismatch.java.lang.Double=Deve essere un numero

# Messaggi specifici per campo (hanno la precedenza sui messaggi generici sopra)

# Arbitro
NotBlank.arbitro.nome=Il nome è obbligatorio
Size.arbitro.nome=Il nome non può superare 255 caratteri
NotBlank.arbitro.cognome=Il cognome è obbligatorio
Size.arbitro.cognome=Il cognome non può superare 255 caratteri
NotBlank.arbitro.codiceArbitrale=Il codice arbitrale è obbligatorio
Size.arbitro.codiceArbitrale=Il codice arbitrale non può superare 50 caratteri

# Commento
NotBlank.commento.testo=Il commento non può essere vuoto
Size.commento.testo=Il commento non può superare 1000 caratteri

# Giocatore
NotBlank.giocatore.nome=Il nome è obbligatorio
Size.giocatore.nome=Il nome non può superare 255 caratteri
NotBlank.giocatore.cognome=Il cognome è obbligatorio
Size.giocatore.cognome=Il cognome non può superare 255 caratteri
NotNull.giocatore.dataDiNascita=La data di nascita è obbligatoria
Past.giocatore.dataDiNascita=La data di nascita deve essere nel passato
NotNull.giocatore.altezza=L'altezza è obbligatoria
Min.giocatore.altezza=L'altezza deve essere almeno 100 cm
Max.giocatore.altezza=L'altezza non può superare 250 cm
NotNull.giocatore.ruolo=Il ruolo è obbligatorio

# Partita
NotNull.partita.dataOra=Data e ora sono obbligatorie
NotBlank.partita.luogo=Il luogo è obbligatorio
Min.partita.goalsHome=I goal non possono essere negativi
Min.partita.goalsAway=I goal non possono essere negativi

# Squadra
NotBlank.squadra.nome=Il nome della squadra è obbligatorio
Size.squadra.nome=Il nome non può superare 255 caratteri
NotBlank.squadra.citta=La città è obbligatoria
Size.squadra.citta=La città non può superare 255 caratteri
NotNull.squadra.annoFondazione=L'anno di fondazione è obbligatorio
Min.squadra.annoFondazione=L'anno di fondazione deve essere successivo al 1800
Max.squadra.annoFondazione=L'anno di fondazione non può superare il 2100

# Torneo
NotBlank.torneo.nome=Il nome del torneo è obbligatorio
Size.torneo.nome=Il nome non può superare 255 caratteri
NotNull.torneo.anno=L'anno è obbligatorio
Min.torneo.anno=L'anno deve essere successivo al 1900
Max.torneo.anno=L'anno non può superare il 2100
Size.torneo.descrizione=La descrizione non può superare 2000 caratteri

# Utente
NotBlank.utente.username=Lo username è obbligatorio
Size.utente.username=Lo username deve avere tra 3 e 50 caratteri
NotBlank.utente.password=La password è obbligatoria
Size.utente.password=La password deve avere almeno 6 caratteri

# Codice custom usato esplicitamente nel controller (vedi bindingResult.rejectValue/reject)
utente.duplicate=Questo username è già in uso